# Builds the Android app (Trusted Web Activity around the site) with Bubblewrap.
# The app opens https://<host>/calendar; its content is the Vercel site, so a new
# APK is only needed when android/twa-manifest.json or the icons change.
#
# Signing key (once, see android/README.md): repository secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway key: it installs, but Chrome
# shows the address bar because the key does not match /.well-known/assetlinks.json.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar o APK numa GitHub Release (só com a chave oficial)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "android/**"
      - "frontend/public/manifest.webmanifest"
      - "frontend/public/icons/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

env:
  BUILD_TOOLS: "36.1.0"
  PLATFORM: "android-36"
  BUBBLEWRAP_VERSION: "1.27.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" > /dev/null
          # Bubblewrap only accepts an SDK folder with bin/ (or tools/) at its root,
          # the layout of the SDK it installs itself; the runner keeps it in cmdline-tools/latest.
          [ -e "$ANDROID_HOME/bin" ] || ln -s cmdline-tools/latest/bin "$ANDROID_HOME/bin"

      - name: Bubblewrap
        run: |
          npm install -g "@bubblewrap/cli@$BUBBLEWRAP_VERSION"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > build/android.keystore
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="$KEY_PASSWORD"
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            STOREPASS="test-$(openssl rand -hex 12)"
            KEYPASS="$STOREPASS"
            echo "::add-mask::$STOREPASS"
            keytool -genkeypair -keystore build/android.keystore -alias aur -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STOREPASS" -keypass "$KEYPASS" -dname "CN=Teste, O=Alverca Urban Runners, C=PT"
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK assinado com uma chave de teste (mostra a barra de endereço)."
          fi
          {
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STOREPASS"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"
          FINGERPRINT=$(keytool -list -v -keystore build/android.keystore -alias aur -storepass "$STOREPASS" \
            | sed -n 's/^[[:space:]]*SHA256: //p')
          [ -n "$FINGERPRINT" ] || { echo "::error::Não foi possível ler a chave (alias aur, password?)"; exit 1; }
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        # Icons and the web manifest are read from this checkout, not from the live site,
        # so a pull request builds with its own icons. The URL baked into the app is then
        # put back to the real site.
        run: |
          HOST=$(jq -r .host android/twa-manifest.json)
          LOCAL=http://localhost:8765
          (cd frontend/public && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          jq --arg l "$LOCAL" --argjson code "${{ github.run_number }}" '
              .iconUrl = ($l + "/icons/icon-512.png")
            | .maskableIconUrl = ($l + "/icons/icon-maskable-512.png")
            | .webManifestUrl = ($l + "/manifest.webmanifest")
            | .appVersionCode = $code
            | .appVersionName = (.appVersionName + "." + ($code | tostring))
            | .signingKey.path = "./android.keystore"' android/twa-manifest.json > build/twa-manifest.json
          cd build
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          sed -i "s#$LOCAL#https://$HOST#g" app/build.gradle
          ! grep -rq "localhost:8765" app/build.gradle app/src/main

      - name: Build APK and App Bundle
        working-directory: build
        run: bubblewrap build --manifest=./twa-manifest.json

      - name: Summary
        run: |
          VERSION=$(jq -r .appVersionName build/twa-manifest.json)
          {
            echo "### APK $VERSION"
            echo ""
            echo "- Chave oficial: ${{ steps.key.outputs.official }}"
            echo "- SHA-256 do certificado: \`${{ steps.key.outputs.fingerprint }}\`"
            echo ""
            echo "Com a chave oficial, este valor vai para \`TWA_SHA256_FINGERPRINTS\` na Vercel."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          cp build/app-release-signed.apk "out/alverca-urban-runners-$VERSION.apk"
          cp build/app-release-bundle.aab "out/alverca-urban-runners-$VERSION.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION }}${{ steps.key.outputs.official == 'true' && '' || '-chave-teste' }}
          path: out/
          retention-days: 30

      - name: GitHub Release
        if: ${{ inputs.release && steps.key.outputs.official == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION" out/*.apk \
            --title "App Android $VERSION" \
            --notes "APK da app dos sócios. Instalar no telemóvel Android (permitir instalar de fontes desconhecidas)." \
            --target "$GITHUB_SHA"
