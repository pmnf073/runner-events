<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#081420" />
    <title>RunnerEvents — Alverca Urban Runners</title>
    <script>
      // Apply the saved theme before the first paint, so the splash and the app open in the right colours.
      try { document.documentElement.classList.add(localStorage.getItem("theme") === "light" ? "light" : "dark"); } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <style>
      /* Splash shown while the bundle loads and while the app waits for the server (also used by SplashScreen.jsx). */
      .app-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; background: #081420; color: #9fb3c8; font-family: Inter, system-ui, -apple-system, sans-serif; text-align: center; z-index: 9999; }
      :root.light .app-splash { background: #f4f6f8; color: #4b5563; }
      .app-splash-mark { position: relative; width: 148px; height: 148px; display: flex; align-items: center; justify-content: center; }
      .app-splash-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(204, 51, 51, 0.15); border-top-color: #CC3333; animation: app-splash-spin 1.1s linear infinite; }
      .app-splash-logo { width: 112px; height: 112px; animation: app-splash-run 0.9s ease-in-out infinite; }
      .app-splash-logo-light { display: none; }
      :root.light .app-splash-logo-dark { display: none; }
      :root.light .app-splash-logo-light { display: block; }
      .app-splash-text { font-size: 14px; line-height: 1.5; max-width: 280px; min-height: 42px; }
      .app-splash-text span { display: block; opacity: 0; animation: app-splash-fade 0.6s ease forwards; }
      .app-splash-text span:first-child { animation-delay: 2.5s; }
      .app-splash-text span:last-child { animation-delay: 8s; font-size: 12px; }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @keyframes app-splash-run { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
      @keyframes app-splash-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-ring, .app-splash-logo { animation: none; }
        .app-splash-ring { border-color: rgba(204, 51, 51, 0.35); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash-mark">
          <div class="app-splash-ring"></div>
          <img class="app-splash-logo app-splash-logo-dark" src="/splash-logo-dark.png" alt="Alverca Urban Runners" width="112" height="112" />
          <img class="app-splash-logo app-splash-logo-light" src="/splash-logo-light.png" alt="Alverca Urban Runners" width="112" height="112" />
        </div>
        <div class="app-splash-text"><span>A ligar ao servidor…</span><span>O primeiro acesso pode demorar até um minuto.</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
