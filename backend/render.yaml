version: "1"
services:
  - type: web
    name: runner-events-api
    env: node
    plan: free
    # Same command as the Render dashboard: applies pending migrations on every deploy
    buildCommand: npm install && ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FRONTEND_PREVIEW_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
